# Operations Dashboard - production Nginx.
#
#   http://operations.elsbl/        -> name-based vhost on :80   (primary, this migration)
#   http://10.94.36.10:8090/        -> port-based rollback        (RETAINED, do not remove)
#
# Both serve the SAME compiled SPA (/opt/operations-dashboard/frontend/dist) and proxy /api/ to
# the SAME backend (127.0.0.1:8321), because both include operations-common.conf. The backend is
# never exposed directly.
#
# Same-origin by construction: the SPA calls relative /api/... paths, so no CORS is needed and
# none is configured on the OD backend.
#
# Install: sudo mkdir -p /etc/nginx/operations-dashboard
#          sudo cp deploy/nginx/operations-common.conf /etc/nginx/operations-dashboard/
#          sudo cp deploy/nginx/operations-dashboard.conf /etc/nginx/sites-available/
#          sudo nginx -t && sudo systemctl reload nginx

# --- Primary: name-based vhost on port 80 -----------------------------------------------------
# NOT default_server. BL-DCMS remains the catch-all (it must keep answering Host: 10.94.36.10 for
# the signed Android release), and Nginx prefers an exact server_name match over default_server -
# so this block claims operations.elsbl and nothing else.
server {
    listen 80;
    listen [::]:80;
    server_name operations.elsbl;

    include /etc/nginx/operations-dashboard/operations-common.conf;
}

# --- Rollback: the pre-migration port-based listener -------------------------------------------
# RETAINED DELIBERATELY for the duration of the hostname migration. It is the fallback if internal
# DNS or the vhost misbehaves, and it is the only Operations access path that does not depend on
# the `elsbl` zone resolving. Remove only as a separate, explicitly approved step.
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    include /etc/nginx/operations-dashboard/operations-common.conf;
}
