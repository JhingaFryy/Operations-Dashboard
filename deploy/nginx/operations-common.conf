# Shared body for BOTH Operations Dashboard server blocks (the :80 hostname vhost and the :8090
# rollback listener). Kept in one file deliberately: the two MUST serve the identical compiled
# frontend and the identical backend, and duplicating ~60 lines is how they silently drift apart
# during a migration. Only `listen` and `server_name` differ between the two blocks.
#
# Installed to /etc/nginx/operations-dashboard/operations-common.conf, mirroring the existing
# /etc/nginx/bldcms/ snippet convention.

root /opt/operations-dashboard/frontend/dist;
index index.html;

# Uploads are small JSON payloads only; keep the ceiling tight.
client_max_body_size 2m;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# MSW's service worker ships from frontend/public/ and is therefore always copied into dist by
# Vite. Nothing in the production bundle registers it, so it is inert - but a mock-API service
# worker has no business being reachable in production at all. Denied rather than deleted, so
# the file stays available to the test setup that owns it.
location = /mockServiceWorker.js {
    return 404;
}

# Hashed build assets are immutable.
location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# The SPA shell must never be cached, or a deploy leaves browsers on the old bundle.
location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
}

# Everything the browser calls at runtime. The backend owns authorization; this block only
# transports. Note there is no /docs, /redoc or /openapi.json location: OD's API docs stay
# reachable only on 127.0.0.1:8321 for local troubleshooting, never through Nginx.
#
# Host is forwarded verbatim, so the backend sees `operations.elsbl` (or the IP on :8090). OD's
# backend generates no absolute URLs and runs no TrustedHost middleware, so either value is safe.
location /api/ {
    proxy_pass http://127.0.0.1:8321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    # Authenticated, dynamic data - never cached.
    add_header Cache-Control "no-store" always;
}

# THE ROOT IS TWO THINGS, DECIDED BY METHOD.
#
#   GET/HEAD /  - the Operations Dashboard itself, served from the built shell as always.
#   POST /      - a user arriving from BL-DCMS. BL submits a form carrying a single-use code to
#                 this origin's ROOT, so the browser never visits, displays or records an
#                 intermediate sign-in URL; the address bar only ever shows this root. The
#                 request is proxied to the backend, which redeems the code, leaves an HttpOnly
#                 bootstrap cookie and 303s back to GET / - and the SPA then exchanges that
#                 cookie for its token over /api/. No code, token or password is ever in a URL.
#
# `location = /` is an EXACT match, so it takes precedence over the `location /` prefix below
# without shadowing any other path. Only these three methods are answered here; anything else
# gets 405 rather than falling through to the SPA.
location = / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    limit_except GET HEAD POST { deny all; }

    if ($request_method = POST) {
        # An INTERNAL rewrite, not a redirect: a 30x would turn the POST into a GET and drop
        # the form body, losing the code. `last` restarts location matching, so the request
        # lands in `location /api/` above and is proxied by the same block, with the same
        # headers and timeouts, as every other API call. (nginx forbids a proxy_pass with a
        # URI part inside an `if`, which is why this is a rewrite rather than a direct pass.)
        rewrite ^ /api/auth/handoff/bootstrap last;
    }

    try_files /index.html =404;
}

# SPA fallback: client-side routes (/shed-movement, /section-dashboard, /booking-pool,
# /shed-visits/:id/workflow, /admin/equipment-mapping) are served the shell. Listed last so it
# can never shadow /api/ above.
location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
}
